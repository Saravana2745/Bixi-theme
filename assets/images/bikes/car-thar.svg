<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tharGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="tharGlow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E88124" flood-opacity="0.25"/></filter>
  </defs>
  <g filter="url(#tharGlow)">
    <ellipse cx="250" cy="270" rx="210" ry="16" fill="#000000" opacity="0.6"/>
    <!-- Massive All-Terrain Wheels -->
    <circle cx="120" cy="230" r="48" fill="#0F172A" stroke="#475569" stroke-width="9"/>
    <circle cx="120" cy="230" r="28" fill="#1E293B"/>
    <circle cx="120" cy="230" r="14" fill="#E88124"/>
    <circle cx="380" cy="230" r="48" fill="#0F172A" stroke="#475569" stroke-width="9"/>
    <circle cx="380" cy="230" r="28" fill="#1E293B"/>
    <circle cx="380" cy="230" r="14" fill="#E88124"/>
    
    <!-- Rugged Boxy 4x4 Body -->
    <path d="M 70 215 L 70 145 L 145 85 L 310 85 L 345 135 L 435 140 L 445 170 L 440 220 L 430 225 A 55 55 0 0 0 325 225 L 175 225 A 55 55 0 0 0 65 225 Z" fill="url(#tharGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Hardtop Windows -->
    <rect x="155" y="98" width="65" height="45" rx="4" fill="#38BDF8" fill-opacity="0.7" stroke="#0F172A" stroke-width="3"/>
    <rect x="230" y="98" width="75" height="45" rx="4" fill="#38BDF8" fill-opacity="0.7" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Upright Round Headlamp -->
    <circle cx="435" cy="155" r="12" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Spare Wheel on Tailgate -->
    <rect x="50" y="145" width="20" height="55" rx="5" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    
    <text x="210" y="195" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" fill="#E88124" letter-spacing="2">THAR 4x4 HARDTOP</text>
  </g>
